[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "web_search_mcp"
version = "0.4.0"
description = "FastMCP-based server that provides comprehensive web search functionality for LLM clients through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arxiv>=4.0.0",
    "ddgs>=9.10.0",
    "exa-py",
    "fastmcp>=2.14.4",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pypdf>=6.13.2",
    "tenacity>=9.1.4",
    "trafilatura>=1.12.0",
]

[project.scripts]
web-search-mcp = "web_search_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["web_search_mcp*"]

[tool.setuptools.package-data]
"web_search_mcp" = ["vendor/**/*", "py.typed"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest-asyncio>=0.27.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
    "types-requests>=2.32.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I"]
# S101: assert is standard in pytest tests
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
