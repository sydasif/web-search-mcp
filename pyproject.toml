[project]
name = "web_search_mcp"
version = "0.2.0"
description = "FastMCP-based server that provides comprehensive web search functionality for LLM clients through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.10.0",
    "fastmcp>=2.14.4",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "yt-dlp>=2026.1.29",
]

[project.scripts]
web-search-mcp = "web_search_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["web_search_mcp*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest-asyncio>=0.27.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
    "types-requests>=2.32.0",
]
